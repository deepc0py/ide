[package]
name         = "ide-webview"
version      = { workspace = true }
authors      = { workspace = true }
edition      = { workspace = true }
license      = { workspace = true }
rust-version = { workspace = true }
description  = "Native WKWebView host for VS Code extension webviews, embedded as a child of a floem/winit window."

[dependencies]
serde_json         = { workspace = true }
regex              = { workspace = true }
thiserror          = { workspace = true }
raw-window-handle  = "0.6"
percent-encoding   = "2.3"

[target.'cfg(target_os = "macos")'.dependencies]
wry = "0.57"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSString", "NSDictionary", "NSError"] }
objc2-app-kit = { version = "0.3.2", features = ["NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-web-kit = { version = "0.3.2", features = ["WKWebView", "WKSnapshotConfiguration", "block2"] }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
tao = "0.37"

[[example]]
name = "demo"
path = "examples/demo.rs"
